name: ponto_mobile
description: Ponto do Caminho — app mobile. Só orquestra telas; a regra vive em ponto_motor.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  drift: ^2.34.0
  flutter:
    sdk: flutter
  ponto_motor:
    path: ../../packages/ponto_motor
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # COMPAT: drift_dev >= 2.34.6 pede analyzer/meta mais novos do que o Flutter 3.41 fixa; o pub
  # resolve 2.34.0 sozinho. Subir junto com o Flutter.
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

# SECURITY: o SQLite empacotado é o SQLite3MultipleCiphers — o registro só abre cifrado
# (lib/infra/banco_cifrado.dart recusa um SQLite sem cifra). ADR-002.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  # OPS: assets/livros é symlink para /livros — a fonte única do conteúdo, validada por livros/validar.py.
  # Arquivo a arquivo: o diretório também tem validar.py e README, que não vão para o app.
  assets:
    - assets/livros/colecao.json
    - assets/livros/caminho.json
    - assets/livros/sulco.json
    - assets/livros/forja.json
    - assets/fonts/OFL.txt

  # Literata (SIL OFL 1.1, assets/fonts/OFL.txt) — fonte variável; FontWeight ajusta o eixo wght.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
        - asset: assets/fonts/Literata-Italic-Variable.ttf
          style: italic

